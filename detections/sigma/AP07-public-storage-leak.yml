title: AP07 - Public Storage misconfig and key recovery (allowBlobPublicAccess / public container / listKeys)
id: c4f8e1a6-2b7d-4e39-9a1f-6c3b8d05e2f4
status: experimental
description: |
  Detects the MANAGEMENT PLANE of the AP07 chain of AETHER (exfiltration in the Azure
  storage plane). A storage account is deployed / drifted to vulnerable with TWO anonymous
  access gates: at the ACCOUNT level allowBlobPublicAccess=true
  (Microsoft.Storage/storageAccounts/write) and at the CONTAINER level publicAccess=blob|container
  (Microsoft.Storage/storageAccounts/blobServices/containers/write; 'container' additionally enables
  the anonymous LIST = T1619). Inside the public container, 'backup-config.json' is leaked with an
  over-permissioned credential (a long-lived account SAS or the account key) pointing to the private
  container 'sensitive-data'; account-key recovery is observed as
  Microsoft.Storage/storageAccounts/listKeys/action (T1552.001). The defender SEES the vuln planted:
  the lab deployment itself generates these events (parallel to 4899/4900 in AP05). The DATA PLANE
  (ANONYMOUS access to the blobs and the PIVOT with the SAS/key against 'sensitive-data') lives in
  StorageBlobLogs, which is NOT a standard Sigma logsource -> it is covered in the companion KQL
  AP07-public-storage-leak.kql, KQL-primary for that part (golden signal AuthenticationType==
  'Anonymous' + chain correlation by CallerIpAddress).
references:
  - https://attack.mitre.org/techniques/T1530/
  - https://attack.mitre.org/techniques/T1619/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
  - https://learn.microsoft.com/en-us/azure/storage/blobs/security-recommendations
author: AETHER
date: 2026-11-15
logsource:
  product: azure
  service: activitylogs
detection:
  # signal -> ACCOUNT misconfig (gate 1): creation/update of the storage account.
  # The value allowBlobPublicAccess=true (the vuln) is NOT always serialized in AzureActivity
  # (the request body does not travel reliably) -> keyed on the OPERATION, not on the value;
  # the value is confirmed in the data plane (companion KQL) or by reading the account config.
  # Also fires on the lab deployment and on remediation (allowBlobPublicAccess=false):
  # the defender SEES the vuln planted / removed (like 4899/4900 in AP05).
  sel_account_write:
    operationName|contains: 'Microsoft.Storage/storageAccounts/write'
  # signal -> ACCOUNT KEY recovery (leak_mode=account_key, or any key theft):
  # listKeys exposes the shared key = full control of the data plane (all containers,
  # write, delete). Direct signature of T1552.001 on the management plane.
  sel_listkeys:
    operationName|contains: 'Microsoft.Storage/storageAccounts/listKeys/action'
  # signal -> CONTAINER misconfig (gate 2): creation/update of a container via ARM
  # (publicAccess=blob opens anonymous READ; publicAccess=container also enables anonymous LIST).
  sel_container_write:
    operationName|contains: 'Microsoft.Storage/storageAccounts/blobServices/containers/write'
  # Successful events only (same pattern as AP02): not every successful record populates
  # properties.statusCode -> status is ALSO checked (OR between the two, never an AND that
  # silently discards the records that populate only one of the fields).
  filter_success_code:
    properties.statusCode:
      - 'OK'
      - 'Created'
      - 'Accepted'
  filter_success_status:
    status|contains: 'Succ'          # Success / Succeeded
  condition: (sel_account_write or sel_listkeys or sel_container_write) and (filter_success_code or filter_success_status)
fields:
  - caller                 # acting principal (objectId / UPN; expected IaC/operator, not an attacker)
  - callerIpAddress
  - operationName
  - resourceGroupName
  - properties.statusCode
falsepositives:
  - Legitimate IaC (Terraform/Bicep/ARM) or pipelines that create/update storage accounts and
    containers during authorized deployments (sel_account_write / sel_container_write) -
    correlate with the expected automation principal and scope to the lab accounts.
    Note - sel_account_write (storageAccounts/write) is HIGH VOLUME - it fires on ANY
    property change of the account, not only on allowBlobPublicAccess=true (hence level medium).
  - Legitimate account-key rotation/read by operators or applications still using
    shared key (sel_listkeys); allowlist those principals and migrate the data plane to Entra RBAC.
  - High-fidelity note - confirmation that the account became ANONYMOUSLY accessible
    (allowBlobPublicAccess=true + public container) and the SAS/key PIVOT against 'sensitive-data'
    are seen in the DATA PLANE (StorageBlobLogs) -> AP07-public-storage-leak.kql, very low FP.
level: medium
tags:
  - attack.collection
  - attack.t1530              # Data from Cloud Storage (goal of the chain)
  - attack.discovery
  - attack.t1619              # Cloud Storage Object Discovery (publicAccess=container -> anonymous LIST)
  - attack.credential_access
  - attack.t1552.001          # Credentials In Files / listKeys = recovery of the shared key
# ---------------------------------------------------------------------
# Signal -> AP07 attack stage mapping (see companion AP07-public-storage-leak.kql):
#   sel_account_write   -> allowBlobPublicAccess=true at the ACCOUNT level (gate 1 open).   [misconfig]
#   sel_container_write -> publicAccess=blob|container at the CONTAINER level (gate 2;
#                          'container' enables the anonymous LIST = T1619).                  [misconfig]
#   sel_listkeys        -> recovery of the shared key (leak_mode=account_key / theft).       [T1552.001]
#
# Sigma vs KQL SPLIT (declared EXPLICITLY, like AP02 'the KV AuditEvent is not
# activitylogs' and AP05 'the SAN does not travel in 4886/4887'):
#   * Sigma (THIS file, logsource azure/activitylogs) = MANAGEMENT PLANE: the misconfig
#     (allowBlobPublicAccess / publicAccess) + listKeys. It is what the azure logsource models.
#   * The DATA PLANE -ANONYMOUS access to the blobs (ListBlobs/GetBlob) and the PIVOT with SAS/
#     key against 'sensitive-data'- lives in StorageBlobLogs, which is NOT a standard Sigma
#     logsource -> KQL-primary (AP07-public-storage-leak.kql: SIGNAL A anonymous, SIGNAL B pivot,
#     OUTPUT 2 chain correlation by CallerIpAddress).
#
# CAVEATS:
#   (1) StorageBlobLogs is NOT active by default (requires the diagnostic setting on
#       blobServices/default with destination "Dedicated"). AzureActivity -this file- DOES flow
#       without provisioning anything (the misconfig and the listKeys are always recorded).
#   (2) The VALUE of the misconfig (allowBlobPublicAccess=true, publicAccess=container) is NOT always
#       serialized in AzureActivity -> the rule keys on the OPERATION; confirm the value in
#       the data plane (KQL) or by reading the account config. Hence level: medium.
#   (3) sel_container_write (blobServices/containers/write) does NOT fire on the lab DEPLOYMENT:
#       azurerm_storage_container creates the container via the DATA PLANE (Blob REST API),
#       not via ARM, so that event does not reach AzureActivity on the apply. DEPLOYMENT
#       telemetry is provided by sel_account_write (storageAccounts/write with allowBlobPublicAccess=
#       true) + sel_listkeys. sel_container_write only fires on container changes via
#       portal/CLI/ARM/azapi (public-access flip by an admin or attacker) -> still valid
#       Azure content, but an instructor should NOT expect it to light up when validating the lab.
#   (4) Complement with Microsoft Defender for Storage (native anonymous-access/exfil) and with
#       Azure Policy 'Storage account public access should be disallowed' (prevents drift to
#       vulnerable across the whole subscription).
# ---------------------------------------------------------------------
