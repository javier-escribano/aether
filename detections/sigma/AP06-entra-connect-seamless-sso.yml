title: AP06 - Entra Connect / Seamless SSO (AZUREADSSOACC$) - DCSync of the sync account, key extraction and silver ticket (on-prem->cloud bridge)
id: b6e1d4c7-3a92-4f85-9c2e-1f7a6b3d8e40
status: experimental
description: |
  Detects the AP06 chain of AETHER on the hybrid DC shared with AP05
  (on-prem in Azure IaaS). The Entra Connect synchronization account
  (AETHER\Sync_AETHER, seeded with DCSync rights) performs DCSync (4662 +
  replication GUID) to extract the Kerberos keys of the machine account
  AZUREADSSOACC$; with them it FORGES a SILVER TICKET for the SPN
  HTTP/autologon.microsoftazuread-sso.com impersonating any synchronized user,
  and authenticates to the CLOUD as that user WITHOUT their password (T1550)
  -> the on-prem compromise JUMPS to Entra ID. Star weakness (vs AP05, which
  ends in on-prem DCSync): the AZUREADSSOACC$ password is NEVER rotated by
  default -> its stolen hash is valid forever = persistence. Three INDEPENDENT
  signals correlated with OR (each one fires on its own; lesson from
  AP04/AP05/AP07: never a global AND that silently discards a branch): 4662
  DCSync (star) with the replication GUIDs by the sync account; 4769 TGS of the
  Seamless SSO SPN (HUNT: a silver ticket forged offline does NOT always touch the
  DC); 4741/4742 creation/change of AZUREADSSOACC$. Source: Windows Security
  events from the DC ingested via Azure Monitor Agent + Data Collection Rule.
  Prerequisite: Directory Service Access + Kerberos Service Ticket Operations +
  Computer Account Management auditing (seed-ap06 enables it; 4662 ALSO requires a
  SACL on the naming context) - without it the events are NOT generated. The CLOUD
  leg (Entra SigninLogs of the Seamless SSO sign-in) is NOT provisioned by the lab:
  a declared limit (as AP05 declares its limits); complement with Microsoft
  Defender for Identity (Suspected DCSync / Suspected Golden/Silver Ticket).
references:
  - https://attack.mitre.org/techniques/T1552/
  - https://attack.mitre.org/techniques/T1003/006/
  - https://attack.mitre.org/techniques/T1558/001/
  - https://attack.mitre.org/techniques/T1550/
  - https://learn.microsoft.com/en-us/defender-for-identity/
author: AETHER
date: 2026-11-15
logsource:
  product: windows
  service: security
detection:
  # STAR signal -> T1003.006: DCSync. 4662 (Directory Service Access) whose
  # 'Properties' field contains the directory-replication property GUIDs. BOTH
  # (Get-Changes and -All) are required for a functional DCSync; covered with OR.
  sel_dcsync_4662:
    EventID: 4662
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'  # DS-Replication-Get-Changes
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'  # DS-Replication-Get-Changes-All
  # HUNT signal -> T1558.001: TGS (4769) for the Seamless SSO SPN. CAVEAT: a
  # silver ticket forged OFFLINE with the stolen key does NOT pass through the KDC ->
  # often does NOT generate 4769; it is hunt/baseline, never an AND gate of the forge.
  sel_sso_tgs_4769:
    EventID: 4769
    ServiceName|contains:
      - 'AZUREADSSOACC'
      - 'autologon.microsoftazuread-sso.com'
  # signal -> seeding/rotation: creation (4741) or change (4742) of AZUREADSSOACC$.
  # Seeding by seed-ap06 and -Remediate (rotate the key 2x) fire here.
  sel_ssoacct_change_4741_4742:
    EventID:
      - 4741
      - 4742
    TargetUserName|contains: 'AZUREADSSOACC'
  condition: sel_dcsync_4662 or sel_sso_tgs_4769 or sel_ssoacct_change_4741_4742
fields:
  - EventID
  - SubjectUserName
  - ObjectName
  - Properties
  - ServiceName
  - TicketEncryptionType
  - TargetUserName
  - IpAddress
falsepositives:
  - Legitimate Azure AD Connect synchronization (the real sync account constantly generates 4662 with the replication GUIDs): allowlist the known sync account.
  - Legitimate Seamless SSO sign-ins (sel_sso_tgs_4769): expected baseline; use as hunt, not as a hard alert.
  - Legitimate management of the AZUREADSSOACC$ account during an approved key rollover (sel_ssoacct_change_4741_4742): known change windows.
level: high
tags:
  - attack.credential_access
  - attack.t1552
  - attack.t1003.006
  - attack.t1558.001
  - attack.lateral_movement
  - attack.t1550
# ---------------------------------------------------------------------
# Signal -> AP06 attack stage mapping (see companion AP06-entra-connect-seamless-sso.kql):
#   sel_dcsync_4662 -> 4662 + replication GUID by the sync account:
#        DCSync = extraction of the Kerberos keys of AZUREADSSOACC$             [T1552 -> T1003.006]
#   sel_sso_tgs_4769 -> 4769 of the Seamless SSO SPN: silver ticket HUNT; LOAD-BEARING
#        CAVEAT: a ticket forged offline may NOT touch the DC -> ABSENT          [T1558.001]
#   sel_ssoacct_change_4741_4742 -> 4741/4742 on AZUREADSSOACC$: seeding (seed-ap06)
#        or rotation of the vuln (-Remediate); the defender SEES it planted/rotated [visibility]
# CAVEATS:
#   (1) 4662 is high volume and requires Directory Service Access auditing + a SACL
#       on the domain naming context; WITHOUT it the events are NOT generated.
#       seed-ap06 enables the auditing subcategories (gated on enable_ap06).
#   (2) The SILVER TICKET forged offline does NOT always touch the DC -> 4769 is a HUNT,
#       never an AND gate (requiring it would discard the forge itself - lesson from AP07).
#   (3) Declared CLOUD LIMIT: the effective authentication to the cloud with the ticket
#       (T1550) would be seen in Entra SigninLogs (autologon.microsoftazuread-sso.com) /
#       AADServicePrincipalSignInLogs, but the lab does NOT provision the tenant/Entra
#       Connect -> AP06 covers ONLY the ON-PREM leg. Complement with Microsoft
#       Defender for Identity (Suspected DCSync / Suspected Golden/Silver Ticket).
#   (4) AZUREADSSOACC must be a COMPUTER object (sAMAccountName AZUREADSSOACC$)
#       with the Seamless SSO SPNs; its password is NEVER rotated by default = the
#       persistence primitive of AP06.
# ---------------------------------------------------------------------
