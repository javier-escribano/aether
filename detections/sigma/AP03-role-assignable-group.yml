title: Low-Priv Owner Self-Add to Role-Assignable Group Carrying Privileged Role Administrator (AETHER AP03)
id: c7e4a9b2-3f81-4d6e-9a05-1b2c3d4e5f60
status: experimental
description: >
  Detects the AP03 chain: a LOW-privilege user who is OWNER of a role-assignable
  group (isAssignableToRole=true) carrying the directory role 'Privileged Role
  Administrator' SELF-ADDS to the group membership ('Add member to group' with the
  initiator == the added member). By Entra design, the membership of a
  role-assignable group can only be modified by Global Admin, Privileged Role Admin
  and the OWNERS, so the owner's self-add requires no administrator role (T1098).
  On joining, the user inherits PRA (assigned to the group, T1098.003) and uses it
  to self-assign Global Administrator (T1078.004). The rule also covers assigning a
  privileged directory role to a group and granting Global Administrator. The
  tentative 'T1484.003' from the catalog does not exist in ATT&CK and is replaced
  by the validated set T1098 / T1098.003 / T1078.004.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://attack.mitre.org/techniques/T1098/003/
  - https://attack.mitre.org/techniques/T1078/004/
  - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/groups-concept
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-azure-monitor-audit-log-schema
author: AETHER
date: 2026-11-14
logsource:
  product: azure
  service: auditlogs
detection:
  # --- Stage 3 (T1098): member added to the target role-assignable group ---
  selection_addmember:
    OperationName: 'Add member to group'
  # --- Precondition/persistence (T1098): owner added on the same group ---
  selection_addowner:
    OperationName: 'Add owner to group'
  # Anchor to the lab's privileged group (adjust to the actual lab_prefix).
  selection_group:
    TargetResources|contains: 'aether-ap03-role-admins'
  # --- Stages 2/5 (T1098.003 / T1078.004): assignment of a privileged directory
  #     role (PRA to the group) or self-grant of Global Administrator ---
  selection_roleops:
    OperationName:
      - 'Add member to role'
      - 'Add eligible member to role'
      - 'Add member to role in PIM requested (permanent)'
      - 'Add member to role in PIM completed (permanent)'
  selection_privrole:
    TargetResources|contains:
      - 'Privileged Role Administrator'
      - 'Global Administrator'
  filter_success:
    Result: 'success'
  condition: ( ((selection_addmember or selection_addowner) and selection_group) or (selection_roleops and selection_privrole) ) and filter_success
fields:
  - OperationName
  - InitiatedBy
  - TargetResources
  - Result
falsepositives:
  - Legitimate provisioning of the role-assignable group and its role via authorized
    IaC (Terraform/Bicep) - correlate with the expected automation principal
  - An administrator (GA/PRA) managing the group's owners or membership via an
    approved change; investigate when the initiator is a low-privilege user
  - High-fidelity note: an 'Add member to group' where InitiatedBy.user.id
    == TargetResources[0].id (self-add) on a role-assignable group has a very
    low false-positive rate - see AP03-role-assignable-group.kql (OUTPUT 2)
level: high
tags:
  - attack.persistence
  - attack.t1098               # owner self-add to the membership of the group they own
  - attack.privilege_escalation
  - attack.t1098.003           # inheritance of Privileged Role Administrator via group membership
  - attack.t1078.004           # exercise PRA to self-assign Global Administrator (tenant takeover)
# ---------------------------------------------------------------------
# Signal -> AP03 attack stage mapping:
#   selection_addmember + selection_group -> Stage 3: owner self-add to the
#        membership of the role-assignable group (key: initiator == member)    [T1098]
#   selection_addowner  + selection_group -> Precondition/persistence: adding a
#        low-privilege delegated owner on the group                            [T1098]
#   selection_roleops + 'Privileged Role Administrator' (target Group) ->
#        Stage 2: PRA assigned TO THE GROUP -> its members inherit it          [T1098.003]
#   selection_roleops + 'Global Administrator' -> Stage 5: final self-grant
#        of Global Administrator by exercising PRA                             [T1078.004]
# Inheriting the role on joining the group emits NO event of its own; the
# observable signal is the 'Add member to group'. The initiator==member
# (self-add) discriminant is evaluated in the companion KQL (AuditLogs, InitiatedBy.user.id).
# ---------------------------------------------------------------------
