title: Over-Privileged Managed Identity Self-Grant and Key Vault Secret Theft (Azure Attack Range AP02)
id: 2d9c4f71-8a63-4e2b-b1c7-0a2f6e4b1c73
status: experimental
description: >
  Detects the AP02 chain: a Managed Identity (or other principal) with excessive
  privilege (Contributor on the RG) modifies a Key Vault access policy to
  self-grant data-plane permission (self-grant, T1098) and/or assigns itself an
  RBAC role, followed by reading the loot secret from the vault (T1552.005). The
  secret is the client secret of a service principal, which enables lateral
  movement to data (T1078.004). The IMDS call (169.254.169.254) used to steal the
  MI token leaves no telemetry of its own in Azure; the observable signal appears
  downstream in the Activity Log and in the Key Vault AuditEvent.
references:
  - https://attack.mitre.org/techniques/T1552/005/
  - https://attack.mitre.org/techniques/T1078/004/
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/azure/key-vault/general/logging
author: Azure Attack Range
date: 2026-11-14
logsource:
  product: azure
  service: activitylogs
detection:
  # --- Stage 5 (T1098): self-grant rewriting the Key Vault access policy ---
  selection_kv_policy:
    operationName|contains:
      - 'Microsoft.KeyVault/vaults/accessPolicies/write'
      - 'Microsoft.KeyVault/vaults/write'
  # --- Stage 5 (T1098/T1078.004): excessive role assignment to the identity ---
  selection_roleassign:
    operationName|contains: 'Microsoft.Authorization/roleAssignments/write'
  # Successful events only. TWO fields are checked because not every successful
  # record populates properties.statusCode; success is also reflected in status.
  filter_success_code:
    properties.statusCode:
      - 'OK'
      - 'Created'
      - 'Accepted'
  filter_success_status:
    status|contains: 'Succ'          # Success / Succeeded
  condition: (selection_kv_policy or selection_roleassign) and (filter_success_code or filter_success_status)
fields:
  - caller                 # acting principal (objectId of the over-privileged MI)
  - callerIpAddress
  - operationName
  - resourceGroupName
  - properties.statusCode
falsepositives:
  - Legitimate IaC (Terraform/Bicep/ARM) that manages access policies or role
    assignments during authorized deployments - correlate with the expected automation principal
  - Platform operators granting Key Vault access via approved changes
  - Note: a self-grant followed within minutes by a SecretGet by the SAME principal
    (see AP02-managed-identity.kql, OUTPUT 2) has a very low false-positive rate
level: high
tags:
  - attack.credential_access
  - attack.t1552.005          # theft of the Key Vault secret (via the MI token over IMDS)
  - attack.defense_evasion
  - attack.persistence
  - attack.t1098              # self-grant: modify the access policy to grant yourself data access
  - attack.privilege_escalation
  - attack.t1078.004          # use of the over-privileged MI and the stolen SP (lateral)
# ---------------------------------------------------------------------
# Signal -> AP02 attack stage mapping:
#   selection_kv_policy  -> Stage 5: self-grant on Key Vault (access-policy)      [T1098]
#   selection_roleassign -> Stage 5 (RBAC variant) / base excessive privilege     [T1098 / T1078.004]
#   (vault SecretGet, Stage 6 T1552.005) is covered in the KQL: the Key Vault
#   AuditEvent table is not an activitylogs logsource. For a Sigma rule dedicated
#   to the data plane, use a second file with logsource category: keyvault.
# ---------------------------------------------------------------------
