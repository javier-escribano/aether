title: Illicit OAuth Consent Grant to High-Value Graph Scopes (Azure Attack Range AP01)
id: 7b3f1a2e-6c94-4d51-9a2b-0a1b2c3d4e5f
status: experimental
description: >
  Detects a consent grant (user or delegated) to an application that is awarded
  high-value Microsoft Graph permissions (mail/file read + offline_access),
  the pattern behind consent phishing / illicit consent grant.
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-risky-oauth
author: Azure Attack Range
date: 2026-11-14
logsource:
  product: azure
  service: auditlogs
detection:
  selection_op:
    OperationName:
      - 'Consent to application'
      - 'Add delegated permission grant'
  selection_scopes:
    ModifiedProperties|contains:
      - 'Mail.Read'
      - 'Mail.ReadWrite'
      - 'Files.Read.All'
      - 'Files.ReadWrite.All'
      - 'offline_access'
      - 'Directory.Read.All'
  condition: selection_op and selection_scopes
fields:
  - InitiatedBy
  - TargetResources
  - ModifiedProperties
falsepositives:
  - Admin consent to approved corporate applications
  - Legitimate mail/storage integrations (verify the publisher is verified)
level: high
tags:
  - attack.credential_access
  - attack.t1528
  - attack.persistence
  - attack.t1098.003
