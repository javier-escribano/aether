title: AP05 - AD CS ESC1 (Enrollee-Supplies-Subject) - honeytemplate enrollment, template change and PKINIT TGT on a hybrid DC
id: 7d9b2c4a-5e61-4f8a-b3c2-1a2b3c4d5e6f
status: experimental
description: |
  Detects the AP05 chain of AETHER (AD CS ESC1 on a hybrid on-prem DC in
  Azure IaaS). A low-privilege user (AETHER\ap05user) enrolls the deliberately
  vulnerable template 'AetherAuthESC1' (ENROLLEE_SUPPLIES_SUBJECT + Client
  Authentication + Enroll for Domain Users + no manager approval), specifies
  SAN = UPN of a Domain Admin, and authenticates the forged certificate via PKINIT to
  obtain a TGT as that DA (-> DCSync). Source: Windows Security events from the
  DC/CA ingested via Azure Monitor Agent + Data Collection Rule (NOT Entra cloud
  logs). Three INDEPENDENT signals correlated with OR (each one fires on its own;
  lesson from AP04: never a global AND that silently discards a branch when an event
  is missing or the SAN does not travel): (sel_request_issue / sel_request_issue_attrs) request
  or issuance of a cert on the ESC1 honeytemplate = T1649; (sel_template_change)
  creation/change/security of an AD CS template = seeding or tampering; (sel_pkinit_tgt)
  Kerberos TGT via PKINIT = use of the forged certificate (T1550). Prerequisite: AD CS
  auditing (certutil -setreg CA\AuditFilter 127 + auditpol 'Certification Services') and
  'Kerberos Authentication Service' (Success) enabled; without them the events are NOT
  generated. Complement: Microsoft Defender for Identity ships native ESC1 detection.
references:
  - https://attack.mitre.org/techniques/T1649/
  - https://attack.mitre.org/techniques/T1550/
  - https://attack.mitre.org/techniques/T1003/006/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/dn786423(v=ws.11)
  - https://www.blackhillsinfosec.com/detecting-adcs-privilege-escalation/
  - https://posts.specterops.io/certified-pre-owned-d95910965cd2
  - https://learn.microsoft.com/en-us/defender-for-identity/
author: AETHER
date: 2026-11-14
logsource:
  product: windows
  service: security
detection:
  # signal -> T1649: request (4886) / ISSUANCE (4887) of a cert on the ESC1 honeytemplate.
  # The template name is NOT a reliable dedicated field in 4886/4887: in builds < WS2025 it
  # travels inside 'Attributes' (line "CertificateTemplate:<cn|oid>"); WS2025 and some
  # normalized pipelines expose a 'CertificateTemplate' field. BOTH locations are covered
  # with OR so the branch is not lost (no silent AND - lesson from AP04).
  sel_request_issue:
    EventID:
      - 4886
      - 4887
    CertificateTemplate|contains: 'AetherAuthESC1'
  sel_request_issue_attrs:
    EventID:
      - 4886
      - 4887
    Attributes|contains: 'AetherAuthESC1'
  # signal -> seeding / tampering: AD CS template updated (4899) or its security (4900).
  # Seeding 'AetherAuthESC1' (seed-ap05) and remediation (-Remediate) fire here.
  sel_template_change:
    EventID:
      - 4899
      - 4900
  # signal -> T1550: Kerberos TGT (4768) via PKINIT = authentication with the forged cert.
  # PreAuthType 16 = PA-PK-AS-REQ (PKINIT); password preauth is 2. PreAuthType is used
  # instead of 'CertThumbprint|exists' because on Windows 2016+ the CertThumbprint field is ALWAYS
  # present (empty for non-PKINIT) -> '|exists' would match ALL 4768 (high volume); the
  # equivalent signal is CertThumbprint / CertSerialNumber being non-empty.
  sel_pkinit_tgt:
    EventID: 4768
    PreAuthType: 16
  condition: sel_request_issue or sel_request_issue_attrs or sel_template_change or sel_pkinit_tgt
fields:
  - EventID
  - Requester
  - Attributes
  - Subject
  - SubjectUserName
  - TargetUserName
  - ClientAddress
  - PreAuthType
  - CertThumbprint
falsepositives:
  - Legitimate enrollment in custom or smartcard authentication templates if the name is reused; scope sel_request_issue/_attrs to the EXACT name of the lab honeytemplate (AetherAuthESC1).
  - Legitimate smartcard / PKINIT logons (sel_pkinit_tgt); maintain an allowlist of accounts and hosts with expected PKINIT.
  - Legitimate template management by PKI administrators (sel_template_change); allowlist the PKI admins and approved change windows.
level: high
tags:
  - attack.credential_access
  - attack.t1649
  - attack.defense_evasion
  - attack.lateral_movement
  - attack.t1550
  - attack.t1003.006
# ---------------------------------------------------------------------
# Signal -> AP05 attack stage mapping (see companion AP05-adcs-esc1.kql):
#   sel_request_issue / sel_request_issue_attrs -> 4886/4887 on 'AetherAuthESC1':
#        enrolling the honeytemplate is NEVER normal -> every hit is suspicious     [T1649]
#   sel_template_change -> 4899/4900: seeding the vuln (seed-ap05) or its
#        remediation/tampering; the defender SEES the vuln planted/removed          [T1649]
#   sel_pkinit_tgt -> 4768 PreAuthType=16: TGT via PKINIT with the forged cert
#        (in the companion KQL it is correlated with issuance -> DIFFERENT/priv acct)[T1550 -> T1003.006 DCSync]
# CAVEATS:
#   (1) The forged SAN (DA's UPN) does NOT travel reliably in 4886/4887 - it lives in the CA DB
#       (certutil -view); that is why the rule does NOT depend on requester!=SAN: it relies on
#       the fact that enrolling the honeytemplate is already suspicious and on the correlation with 4768.
#   (2) Auditing prerequisite (AuditFilter 127 + auditpol 'Certification Services'
#       and 'Kerberos Authentication Service'): WITHOUT it, the events are NOT generated.
#   (3) Complement with Microsoft Defender for Identity (native ESC1 detection) and, after
#       KB5014754, with System channel events 39/41 (Kerberos-Key-Distribution-Center)
#       when the requester SID != subject SID (strong certificate mapping).
# ---------------------------------------------------------------------
