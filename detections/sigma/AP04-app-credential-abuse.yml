title: AP04 - Credencial anadida a App Registration por owner y self-grant de rol via Service Principal
id: a3f1c7e2-4b9d-4e81-9c5a-7f2d6b8e40a1
status: experimental
description: |
  Detecta la cadena AP04 de Caelum Range (abuso de credenciales de app registration y
  persistencia de service principal). Un owner de bajo privilegio anade un client secret o
  certificado a una App Registration cuyo SP porta un app role tier-0 de Microsoft Graph
  (p.ej. RoleManagement.ReadWrite.Directory, 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8), se
  autentica como el SP y se auto-asigna Global Administrator. Cubre tres senales de Entra
  AuditLogs: (sel_cred) alta de credencial = T1098.001 NUCLEO; (sel_consent) admin-consent
  del app role de Graph sobre el SP = precondicion/T1098.003; (sel_sp_role) asignacion de rol
  de directorio iniciada por un service principal = self-grant T1098.003/T1078.004 (alta prioridad).
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://attack.mitre.org/techniques/T1098/003/
  - https://attack.mitre.org/techniques/T1078/004/
  - https://graphpermissions.merill.net/permission/RoleManagement.ReadWrite.Directory
  - https://posts.specterops.io/azure-privilege-escalation-via-service-principal-abuse-210ae2be2a5
author: Caelum Range
date: 2026-11-14
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
  - attack.t1098.001
  - attack.t1098.003
  - attack.t1078.004
logsource:
  product: azure
  service: auditlogs
detection:
  # senal -> etapa 2 (T1098.001): alta de secret/cert sobre app o SP (default de Entra = lo explotable).
  # OperationName-first: no se exige ademas una modifiedProperty concreta, para no perder la rama
  # 'Add service principal credentials' (ver KQL companero, bloque [A]).
  sel_cred:
    properties.message:
      - 'Add service principal credentials'
      - 'Update application - Certificates and secrets management'
      - 'Update application – Certificates and secrets management'
  # senal -> etapa 0 (precondicion / T1098.003): admin-consent de un permiso de APLICACION de Graph
  # sobre el SP. Solo la variante app-only ('... to service principal'); la variante delegada/usuario
  # ('Add app role assignment grant to user') NO es la que habilita AP04 y se excluye (alinea con KQL [B]).
  sel_consent:
    properties.message:
      - 'Add app role assignment to service principal'
  # senal -> etapa 4 (self-grant / T1098.003 + T1078.004): rol de directorio asignado POR un SP
  sel_sp_role:
    properties.message:
      - 'Add member to role'
      - 'Add eligible member to role'
  filter_sp_initiator:
    # el iniciador es un service principal (app-only), no un admin interactivo -> firma del self-grant
    properties.initiatedBy.app.servicePrincipalId|exists: true
  filter_privileged_role:
    # El nombre del rol NO vive en targetResources.displayName (eso es el PRINCIPAL destino): vive en
    # modifiedProperties (displayName=='Role.DisplayName', newValue=="Global Administrator"). Se busca en
    # ese campo-hoja (mirroring KQL [C]) en vez de un |contains sobre el objeto anidado targetResources,
    # que muchos backends de Sigma no resuelven. El newValue viene entrecomillado -> |contains hace substring.
    properties.targetResources.modifiedProperties.newValue|contains:
      - 'Global Administrator'
      - 'Privileged Role Administrator'
  condition: sel_cred or sel_consent or (sel_sp_role and filter_sp_initiator and filter_privileged_role)
falsepositives:
  - Rotacion legitima de secretos/certificados de aplicaciones por sus propietarios o por pipelines de CI/CD (sel_cred); correlacionar con el InitiatedBy y con app management policies.
  - Concesion de app roles de Graph a service principals durante el onboarding de integraciones aprobadas (sel_consent).
  - Herramientas de gobierno de identidad (PIM, access reviews, IGA) que asignan roles mediante su propio service principal (sel_sp_role); mantener una allowlist de esos SP de confianza.
level: high
