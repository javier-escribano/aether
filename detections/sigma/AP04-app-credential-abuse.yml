title: AP04 - Credential added to App Registration by owner and role self-grant via Service Principal
id: a3f1c7e2-4b9d-4e81-9c5a-7f2d6b8e40a1
status: experimental
description: |
  Detects the AP04 chain of Azure Attack Range (app registration credential abuse and
  service principal persistence). A low-privilege owner adds a client secret or
  certificate to an App Registration whose SP carries a tier-0 Microsoft Graph app role
  (e.g. RoleManagement.ReadWrite.Directory, 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8),
  authenticates as the SP and self-assigns Global Administrator. Covers three Entra
  AuditLogs signals: (sel_cred) credential added = T1098.001 CORE; (sel_consent) admin-consent
  of the Graph app role on the SP = precondition/T1098.003; (sel_sp_role) directory role
  assignment initiated by a service principal = self-grant T1098.003/T1078.004 (high priority).
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://attack.mitre.org/techniques/T1098/003/
  - https://attack.mitre.org/techniques/T1078/004/
  - https://graphpermissions.merill.net/permission/RoleManagement.ReadWrite.Directory
  - https://posts.specterops.io/azure-privilege-escalation-via-service-principal-abuse-210ae2be2a5
author: Azure Attack Range
date: 2026-11-14
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
  - attack.t1098.001
  - attack.t1098.003
  - attack.t1078.004
logsource:
  product: azure
  service: auditlogs
detection:
  # signal -> stage 2 (T1098.001): secret/cert added on an app or SP (Entra default = the exploitable one).
  # OperationName-first: no specific modifiedProperty is additionally required, so the
  # 'Add service principal credentials' branch is not lost (see companion KQL, block [A]).
  sel_cred:
    properties.message:
      - 'Add service principal credentials'
      - 'Update application - Certificates and secrets management'
      - 'Update application – Certificates and secrets management'
  # signal -> stage 0 (precondition / T1098.003): admin-consent of a Graph APPLICATION permission
  # on the SP. Only the app-only variant ('... to service principal'); the delegated/user variant
  # ('Add app role assignment grant to user') is NOT the one that enables AP04 and is excluded (aligns with KQL [B]).
  sel_consent:
    properties.message:
      - 'Add app role assignment to service principal'
  # signal -> stage 4 (self-grant / T1098.003 + T1078.004): directory role assigned BY an SP
  sel_sp_role:
    properties.message:
      - 'Add member to role'
      - 'Add eligible member to role'
  filter_sp_initiator:
    # the initiator is a service principal (app-only), not an interactive admin -> signature of the self-grant
    properties.initiatedBy.app.servicePrincipalId|exists: true
  filter_privileged_role:
    # The role name does NOT live in targetResources.displayName (that is the destination PRINCIPAL): it lives in
    # modifiedProperties (displayName=='Role.DisplayName', newValue=="Global Administrator"). We search that
    # leaf field (mirroring KQL [C]) instead of a |contains on the nested targetResources object, which many
    # Sigma backends do not resolve. The newValue is quoted -> |contains does a substring match.
    properties.targetResources.modifiedProperties.newValue|contains:
      - 'Global Administrator'
      - 'Privileged Role Administrator'
  condition: sel_cred or sel_consent or (sel_sp_role and filter_sp_initiator and filter_privileged_role)
falsepositives:
  - Legitimate rotation of application secrets/certificates by their owners or by CI/CD pipelines (sel_cred); correlate with the InitiatedBy and with app management policies.
  - Granting Graph app roles to service principals during the onboarding of approved integrations (sel_consent).
  - Identity governance tools (PIM, access reviews, IGA) that assign roles via their own service principal (sel_sp_role); maintain an allowlist of those trusted SPs.
level: high
