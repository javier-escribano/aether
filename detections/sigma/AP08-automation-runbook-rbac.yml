title: AP08 - Automation runbook authoring/execution and roleAssignments/write (RBAC escalation via Automation Account)
id: a7d3f2b9-8c14-4e6a-b5f0-2d9c1e4a7b63
status: experimental
description: |
  Detects the MANAGEMENT PLANE of the AP08 chain of Azure Attack Range. An Automation Account with
  an OVER-PRIVILEGED system-assigned Managed Identity (User Access Administrator or Owner on its
  RG, both carrying Microsoft.Authorization/roleAssignments/write) is driven by a LOW-privilege
  principal with Automation Contributor. The low-priv user authors and PUBLISHES a runbook
  (Microsoft.Automation/automationAccounts/runbooks/write, .../runbooks/draft/content/write,
  .../runbooks/publish/action) and LAUNCHES a job (.../jobs/write = T1651, Cloud Administration
  Command); the job runs AS the MI and executes New-AzRoleAssignment, which is observed as
  Microsoft.Authorization/roleAssignments/write (T1098.003) WHOSE Caller IS the objectId of the
  Automation Account's MI -> self-grant of Owner on the RG (T1078.004).
  GOLDEN SIGNAL and why it is KQL-primary: the discriminator that separates deployment from attack is
  Caller==objectId-of-the-MI (in the lab apply the MI->role grant is executed by the DEPLOYER; in the
  attack it is executed by the MI). That objectId VARIES per deployment -> a static Sigma rule cannot
  pin it: the Caller==MI narrowing and the chain correlation (low-priv job-launch ->
  MI-grant in the same RG) live in the companion KQL AP08-automation-runbook-rbac.kql. This Sigma
  rule covers the control-plane OPERATIONS (authoring + job + roleAssignment) that the logsource
  azure/activitylogs models portably; the instructor confirms Caller==MI in the KQL.
  DATA PLANE (KQL-primary, NOT covered here): the runbook EXECUTION and the literal text
  New-AzRoleAssignment/Owner live in JobLogs/JobStreams (AzureDiagnostics, ResourceProvider ==
  MICROSOFT.AUTOMATION), which is NOT a standard Sigma logsource and is also OFF by default
  (without the Automation Account's diagnostic setting the execution does NOT exist in any SIEM) ->
  see AP08-automation-runbook-rbac.kql (SignalD + OUTPUT 2).
references:
  - https://attack.mitre.org/techniques/T1651/
  - https://attack.mitre.org/techniques/T1098/003/
  - https://attack.mitre.org/techniques/T1078/004/
  - https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation
  - https://learn.microsoft.com/en-us/azure/automation/automation-manage-send-joblogs-log-analytics
author: Azure Attack Range
date: 2026-11-15
logsource:
  product: azure
  service: activitylogs
detection:
  # signal -> runbook AUTHORING (create/update + write draft content + PUBLISH). In the lab
  # it is fired by the Terraform apply (the loaded gun): the defender SEES the weapon planted (parallel to
  # 4899/4900 of AP05 and to storageAccounts/write of AP07). Caller = the deployer or the low-priv author.
  sel_runbook_authoring:
    operationName|contains:
      - 'Microsoft.Automation/automationAccounts/runbooks/write'
      - 'Microsoft.Automation/automationAccounts/runbooks/draft/content/write'
      - 'Microsoft.Automation/automationAccounts/runbooks/publish/action'
  # signal -> EXECUTION: launch of a runbook job. T1651 (Cloud Administration Command).
  # Terraform NEVER fires it -> jobs/write only appears when the STUDENT runs the "exploit".
  sel_job_write:
    operationName|contains: 'Microsoft.Automation/automationAccounts/jobs/write'
  # signal -> the self-grant: roleAssignments/write. The GOLDEN SIGNAL is that its Caller is the MI of the
  # Automation Account (NOT expressible in static Sigma: variable objectId -> companion KQL). Here
  # the OPERATION is captured; the Caller triage (Caller==ap08_mi_principal_id) lives in the KQL.
  sel_roleassignment_write:
    operationName|contains: 'Microsoft.Authorization/roleAssignments/write'
  # Successful events only (same pattern as AP02/AP07): not every successful record populates
  # properties.statusCode -> status is ALSO checked (OR, never an AND that silently discards
  # the records that populate only one of the two fields).
  filter_success_code:
    properties.statusCode:
      - 'OK'
      - 'Created'
      - 'Accepted'
  filter_success_status:
    status|contains: 'Succ'          # Success / Succeeded
  condition: (sel_runbook_authoring or sel_job_write or sel_roleassignment_write) and (filter_success_code or filter_success_status)
fields:
  - caller                 # acting principal: deployer/low-priv (authoring,job) or the MI (roleAssignment = golden)
  - callerIpAddress
  - operationName
  - resourceGroupName
  - properties.statusCode
falsepositives:
  - Legitimate IaC (Terraform/Bicep/ARM) or pipelines that create/update/PUBLISH runbooks during
    authorized deployments (sel_runbook_authoring) - the AP08 lab apply itself fires them;
    correlate with the expected automation principal and scope to the lab RG.
  - Legitimate execution of operational runbooks (sel_job_write) - high volume in tenants that use
    Automation for maintenance; on its own it does NOT imply an attack (it is T1651 only in the context of the chain).
  - Legitimate RBAC management by operators/IaC (sel_roleassignment_write) - HIGH FREQUENCY. The
    low-FP discriminant is Caller==objectId-of-an-Automation-MI, which this rule CANNOT
    express (variable objectId) -> use AP08-automation-runbook-rbac.kql (SignalC filters Caller==MI;
    OUTPUT 2 correlates low-priv job-launch -> MI-grant in the same RG = near-zero FP).
level: medium
tags:
  - attack.execution
  - attack.t1651              # Cloud Administration Command (execute commands via the runbook)
  - attack.privilege_escalation
  - attack.t1098.003          # Additional Cloud Roles (the self-granted roleAssignments/write)
  - attack.persistence
  - attack.t1078.004          # Valid Accounts: Cloud Accounts (persistence as Owner of the RG)
# ---------------------------------------------------------------------
# Signal -> AP08 attack stage mapping (see companion AP08-automation-runbook-rbac.kql):
#   sel_runbook_authoring     -> Stage 1: authoring + PUBLICATION of the runbook (loaded gun).  [T1651 precursor]
#   sel_job_write             -> Stage 2: job launch = runbook EXECUTION.                        [T1651]
#   sel_roleassignment_write  -> Stage 3: self-grant of Owner on the RG (golden if Caller==MI).  [T1098.003 -> T1078.004]
#
# Sigma vs KQL SPLIT (declared EXPLICITLY, like AP02 'the KV AuditEvent is not activitylogs' and
# AP07 'StorageBlobLogs is not a Sigma logsource'):
#   * Sigma (THIS file, logsource azure/activitylogs) = the control-plane OPERATIONS. It is
#     what the azure logsource models portably.
#   * The GOLDEN SIGNAL (roleAssignments/write with Caller == objectId of the MI) is NOT expressible in
#     static Sigma because that objectId VARIES per deployment -> companion KQL (parameter
#     mi_principal_id = output ap08_mi_principal_id).
#   * The DATA PLANE -JobLogs/JobStreams: the EXECUTION and the New-AzRoleAssignment/Owner text in
#     the streams- lives in AzureDiagnostics (ResourceProvider==MICROSOFT.AUTOMATION), which is NOT a
#     standard Sigma logsource -> KQL-primary (AP08-...-rbac.kql, SignalD + OUTPUT 2 correlation).
#
# CAVEATS:
#   (1) JobLogs/JobStreams are OFF by default (they require the diagnostic setting on the Automation
#       Account). AzureActivity -this file- DOES flow without provisioning anything (authoring, jobs/write and
#       roleAssignments/write are always recorded).
#   (2) deploy-vs-attack DISCRIMINATOR: in the lab apply the MI->role grant is executed by the DEPLOYER
#       (Caller == Terraform identity); in the attack it is executed by the MI (Caller == MI objectId).
#       sel_roleassignment_write captures BOTH -> hence level: medium and the Caller==MI lives in the KQL.
#   (3) sel_runbook_authoring and sel_job_write DO fire in a normal lab validation (the apply
#       publishes the runbook; the student launches the job). The instructor should expect to see them; the escalation is
#       confirmed by the roleAssignments/write BY the MI (KQL SignalC) and the correlation (KQL OUTPUT 2).
#   (4) Complement with Microsoft Defender for Cloud (anomalous role assignment), Azure Policy that
#       denies Owner/User Access Administrator to Automation identities, and PIM (no standing
#       Owner/UAA for any identity).
# ---------------------------------------------------------------------
